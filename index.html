<!DOCTYPE html>
<html lang="pt-BR">
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNYA — Conectados por um propósito</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="container">
    <h2 style="color:#b58aff;letter-spacing:4px">UNYA</h2>
    <span>Comunidade jovem</span>
  </header>

  <main class="container">
    <section style="text-align:center;padding:80px 10px">
      <h1 style="font-size:clamp(38px,8vw,65px)">
        Conectados por <span style="color:#b58aff">um propósito.</span>
      </h1>
      <p class="muted">Fé, amizades, crescimento e missão.</p>
      <button class="primary-button" onclick="mostrarMensagem()">
        Conheça a UNYA
      </button>
    </section>

    <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
      <div class="card"><h2>Comunidade</h2><p class="muted">Conecte-se com outros jovens.</p></div>
      <div class="card"><h2>Espiritualidade</h2><p class="muted">Compartilhe sua fé.</p></div>
      <div class="card"><h2>Missão</h2><p class="muted">Faça a diferença.</p></div>
      <div class="card"><h2>Eventos</h2><p class="muted">Descubra novos encontros.</p></div>
    </section>
  </main>

  <footer style="text-align:center;padding:40px;color:#777">
    UNYA © 2026 — Conectados por um propósito.
  </footer>

  <script src="js/app.js"></script>
  <script>
    function mostrarMensagem() {
      alert("Bem-vindo à UNYA!");
    }
  </script>
</body>
</html>
